name: Nifty Zone Scanner (Live)

# Triggered ONCE per trading day by cron-job.org at 9:14 AM IST.
# Runs an internal infinite loop for ~6 hours, polling Dhan LTPs every 30 sec.
# Ends gracefully at 3:15 PM IST (well within GitHub's 6-hour job limit).

on:
  workflow_dispatch:

permissions:
  contents: write      # needed to commit state_*.json at end of session

# Only one session in flight at a time; new triggers wait for current to finish
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 h hard ceiling — GitHub kills after this
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner loop
        env:
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
          DHAN_ACCESS_TOKEN:  ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:     ${{ secrets.DHAN_CLIENT_ID }}
          # Gemini LLM enrichment of Telegram alerts (optional).
          # Set USE_LLM='true' AND add GEMINI_API_KEY secret to enable.
          # gemini-2.5-flash-lite: cheapest current-gen model (~$0.75/mo for
          # 60 alerts/day). gemini-2.5-flash gives slightly better quality at
          # ~$3/mo. gemini-2.0-flash is being phased out — newer billing-
          # enabled projects return HTTP 404 for it.
          USE_LLM:              'true'            # 'true' to enable LLM analysis
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:         'gemini-2.5-flash-lite'
          TIMEFRAMES:           '1d,1wk,125m'   # Daily, Weekly, and 125-min intraday
          ALERT_ENTRY_PCT:      '1.0'
          ALERT_MIN_SCORE:      '7.0'
          STRICT_FILTER:        'true'
          TF_125M_CLOSENESS_PCT: '0.30'           # 30% rule for 125m / Weekly confluence
          POLL_SECONDS:         '30'             # Dhan LTP poll cadence
          CACHE_REFRESH_MINS:   '60'             # yfinance refresh interval
          PYTHONUNBUFFERED:     '1'              # stream stdout in real-time (no buffering)
        run: python -u loop_scan.py

      - name: Commit updated state
        if: always()                # commit state even if scanner exited via SIGTERM
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --cached --quiet || git commit -m "loop scan: update state [skip ci]"
          git push || echo "nothing to push"

      - name: Notify Telegram on workflow failure
        # Triggers on any failed step (including the scanner crashing, OOM
        # kill, or runner errors). Python-level errors also surface via the
        # in-process alert_once() — this is the outer safety net.
        if: failure()
        run: |
          ICON="🚨"
          MSG="${ICON} *CRITICAL: Scanner workflow FAILED*"
          MSG="${MSG}%0A_Run:_ ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="${MSG}%0A_Job:_ ${GITHUB_JOB}  _Time:_ $(date -u +%H:%M)Z"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d text="${MSG}" > /dev/null || true
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
