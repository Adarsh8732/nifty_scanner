name: Nifty Zone Scanner (Live)

# Triggered ONCE per trading day by cron-job.org at 9:14 AM IST.
# Runs an internal infinite loop for ~6 hours, polling Dhan LTPs every 30 sec.
# Ends gracefully at 3:15 PM IST (well within GitHub's 6-hour job limit).

on:
  workflow_dispatch:

permissions:
  contents: write      # needed to commit state_*.json at end of session

# Only one session in flight at a time; new triggers wait for current to finish
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 h hard ceiling — GitHub kills after this
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ─── PERSISTENT OHLC CACHE ─────────────────────────────────────────
      # Cache the .ohlc_cache/ directory across runs so daily fetches only
      # need to tail-refresh the last few bars per TF instead of re-fetching
      # 5y of history for 1068 symbols × 5 timeframes. The cache key rotates
      # daily (yyyy-mm-dd) so we get one cold miss per day at worst;
      # restore-keys let us fall back to yesterday's cache when today's
      # hasn't been saved yet. On any corruption / >7-day staleness the
      # scanner silently falls back to a full fetch (see ohlc_cache.py).
      - name: Restore OHLC cache
        id: ohlc-cache
        uses: actions/cache@v4
        with:
          # Persists the OHLC bar cache across runs so daily fetches only
          # need to tail-refresh (see ohlc_cache.py — 7-day TTL). Sector
          # map is now a hardcoded dict in sector_map.py; no disk cache
          # needed for it.
          path: .ohlc_cache
          key: scanner-cache-v1-${{ github.run_id }}
          restore-keys: |
            scanner-cache-v1-
            ohlc-cache-v1-

      - name: System memory info
        run: |
          echo "====== MEMORY BEFORE SCANNER ======"
          free -h
          echo "====== CPU INFO ======"
          nproc
          echo "====== DISK ======"
          df -h /

      - name: Run scanner loop
        env:
          # ─── ALERT CHANNEL ROUTING ────────────────────────────────────
          # ALERT_CHANNEL selects where alerts go. Options:
          #   'telegram'  → Telegram only (default; restore after Aug-22 ban lift)
          #   'email'     → SMTP email only (use this during the India Telegram ban)
          #   'both'      → Send to both channels in parallel (paranoid mode)
          # To switch back after the ban lifts: edit this single line.
          ALERT_CHANNEL:      'email'

          # ─── TELEGRAM CREDS (used when ALERT_CHANNEL includes telegram) ─
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}

          # ─── EMAIL CREDS (used when ALERT_CHANNEL includes email) ──────
          # Required GH secrets when email is enabled:
          #   SMTP_USER  — your Gmail (or other) sending address
          #   SMTP_PASS  — Gmail App Password (NOT your regular password)
          #                Get one at: https://myaccount.google.com/apppasswords
          #   EMAIL_TO   — recipient address (can be the same as SMTP_USER)
          # SMTP_HOST / SMTP_PORT default to Gmail (smtp.gmail.com:587)
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}

          # ─── DHAN (live LTP) ──────────────────────────────────────────
          DHAN_ACCESS_TOKEN:  ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:     ${{ secrets.DHAN_CLIENT_ID }}

          # ─── GEMINI LLM ENRICHMENT (optional) ─────────────────────────
          # gemini-2.5-flash-lite: cheapest current-gen model (~$0.75/mo for
          # 60 alerts/day). gemini-2.5-flash gives slightly better quality at
          # ~$3/mo. gemini-2.0-flash is being phased out — newer billing-
          # enabled projects return HTTP 404 for it.
          USE_LLM:              'false'      # Gemini vision analysis disabled
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:         'gemini-2.5-flash-lite'

          # ─── SCANNER CONFIG ───────────────────────────────────────────
          TIMEFRAMES:           '1wk,1d,125m'
          ALERT_ENTRY_PCT:      '1.0'
          ALERT_MIN_SCORE:      '7.0'
          STRICT_FILTER:        'true'
          TF_125M_CLOSENESS_PCT: '0.30'
          POLL_SECONDS:         '30'
          CACHE_REFRESH_MINS:   '60'
          # Comma-separated list of timeframes that require the 3-way
          # legout-strength gate (A: dual-legout | B: 1.5× legin body for
          # reversal zones | C: legout > avg of 21±21 surrounding bodies).
          # Each TF in this list rejects zones where NONE of A/B/C holds.
          # Set to '' to disable everywhere.
          REQUIRE_DUAL_LEGOUT_TFS: '125m,1d'
          # Gap-legout rule: a candle opening this many percent above
          # (green/demand) or below (red/supply) the previous candle's
          # close qualifies as a valid legout, bypassing both EXCITE_PCT
          # and the dual-legout strength gate. Catches small-body opening
          # gaps. Set higher to be stricter, lower to be more permissive.
          GAP_LEGOUT_PCT:       '3.0'
          # ─── SWING-ANCHORED VOLUME PROFILE ───────────────────────────
          # Tags zones with 🎯 VP-POC when the zone band contains the POC
          # of the swing-anchored Volume Profile. Empirical backtest edge:
          # 1d +3.9pp WR, 1wk +8.6pp WR over baseline. Alert TF chart also
          # gets a VP overlay (shaded window + POC line + histogram).
          ENABLE_VP_TAGS:       'true'
          # Comma-separated list of TFs to tag. 125m intentionally
          # excluded — backtest showed no edge.
          VP_TFS:               '1d,1wk'
          VP_PIVOT_LR:          '5'    # pivot detection left=right window
          VP_MIN_BARS:          '10'   # skip VP if anchor < this many bars away
          VP_BINS:              '50'   # histogram resolution
          VP_VA_PCT:            '0.70' # Value Area volume threshold
          # How far back to scan for legout candidates (zone formation).
          # 100 bars ≈ 5 weeks on 125m, ~5 months on 1d, ~2 years on 1wk.
          # Older zones still pass — the scanner picks the one CLOSEST to
          # current price among all valid candidates in the window.
          LOOKBACK_BARS:        '100'
          # Trade-level target: reward-to-risk multiple.
          # Target = entry + RR × (entry - SL). 2.0 means target is 2× risk.
          TARGET_RR_MULTIPLE:   '2.0'
          # Position-sizing: per-trade risk budget shown in the alert as
          # "Qty @ ₹{X} risk: N shares". Default 5000 INR.
          RISK_PER_TRADE_INR:   '5000'
          # Chart visual config — bigger image = more candles per chart.
          # 100 bars × 14×7-inch canvas @ 110 dpi ≈ 1540×770 px, ~150 KB PNG.
          CHART_BARS:           '100'
          CHART_WIDTH_IN:       '14'
          CHART_HEIGHT_IN:      '7'
          PYTHONUNBUFFERED:     '1'
          # ─── OHLC DISK CACHE (F5) ────────────────────────────────────
          # 'true' = wrap fetch_ohlc_batch with the persistent cache above.
          # Set 'false' to disable and force full fetches (debug/rollback).
          USE_DISK_CACHE:       'true'
          OHLC_CACHE_DIR:       '.ohlc_cache'
          # ─── DELIVERY CIRCUIT BREAKER ────────────────────────────────
          # If every configured alert channel fails N times in a row, halt
          # the scanner with exit(2). A single successful delivery resets
          # the counter. Prevents burning API quota / cook cycles when
          # tokens are revoked or SMTP is misconfigured.
          CIRCUIT_BREAKER_THRESHOLD: '5'
          # ─── RRG (RELATIVE ROTATION GRAPH) ────────────────────────────
          # Every mapped-sector alert gets a 2-chart RRG album appended
          # (sector-vs-Nifty500 + stock-vs-sector) plus a RRG text tag.
          # DISPLAY-ONLY — RRG data does NOT affect which alerts fire or
          # their Score. Backtest on 1,175 STRATEGY_WORKS alerts (2026-
          # 07-19) showed the signal is real for Demand+Leading (+5.8pp
          # WR) but too narrow to justify a scoring rule; ship as info
          # so the trader can incorporate it discretionarily. OTHER-
          # mapped stocks skip the RRG block regardless (no sector).
          USE_RRG:              'true'
        run: python -u loop_scan.py

      - name: System memory after scan
        if: always()
        run: |
          echo "====== MEMORY AFTER SCANNER ======"
          free -h

      - name: Commit updated state
        if: always()                # commit state even if scanner exited via SIGTERM
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --cached --quiet || git commit -m "loop scan: update state [skip ci]"
          git push || echo "nothing to push"

      - name: Notify on workflow failure
        # Triggers on any failed step (scanner crash, OOM, runner errors).
        # Python-level errors surface via alert_once() inside the scanner —
        # this is the OUTER safety net for failures that prevent the loop
        # from running at all.
        # Dispatches via Python so the same ALERT_CHANNEL routing applies.
        if: failure()
        env:
          ALERT_CHANNEL:      ${{ env.ALERT_CHANNEL || 'email' }}
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: |
          python -c "
          import os
          from scanner import dispatch_alert
          msg = (
              '🚨 *CRITICAL: Scanner workflow FAILED*\n'
              f'_Run:_ {os.environ[\"GITHUB_SERVER_URL\"]}/'
              f'{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/'
              f'{os.environ[\"GITHUB_RUN_ID\"]}\n'
              f'_Job:_ {os.environ[\"GITHUB_JOB\"]}'
          )
          dispatch_alert(msg)
          " || true
