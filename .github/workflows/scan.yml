name: Nifty Zone Scanner (Live)

# Triggered ONCE per trading day by cron-job.org at 9:14 AM IST.
# Runs an internal infinite loop for ~6 hours, polling Dhan LTPs every 30 sec.
# Ends gracefully at 3:15 PM IST (well within GitHub's 6-hour job limit).

on:
  workflow_dispatch:

permissions:
  contents: write      # needed to commit state_*.json at end of session

# Only one session in flight at a time; new triggers wait for current to finish
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 h hard ceiling — GitHub kills after this
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner loop
        env:
          # ─── ALERT CHANNEL ROUTING ────────────────────────────────────
          # ALERT_CHANNEL selects where alerts go. Options:
          #   'telegram'  → Telegram only (default; restore after Aug-22 ban lift)
          #   'email'     → SMTP email only (use this during the India Telegram ban)
          #   'both'      → Send to both channels in parallel (paranoid mode)
          # To switch back after the ban lifts: edit this single line.
          ALERT_CHANNEL:      'email'

          # ─── TELEGRAM CREDS (used when ALERT_CHANNEL includes telegram) ─
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}

          # ─── EMAIL CREDS (used when ALERT_CHANNEL includes email) ──────
          # Required GH secrets when email is enabled:
          #   SMTP_USER  — your Gmail (or other) sending address
          #   SMTP_PASS  — Gmail App Password (NOT your regular password)
          #                Get one at: https://myaccount.google.com/apppasswords
          #   EMAIL_TO   — recipient address (can be the same as SMTP_USER)
          # SMTP_HOST / SMTP_PORT default to Gmail (smtp.gmail.com:587)
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}

          # ─── DHAN (live LTP) ──────────────────────────────────────────
          DHAN_ACCESS_TOKEN:  ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:     ${{ secrets.DHAN_CLIENT_ID }}

          # ─── GEMINI LLM ENRICHMENT (optional) ─────────────────────────
          # gemini-2.5-flash-lite: cheapest current-gen model (~$0.75/mo for
          # 60 alerts/day). gemini-2.5-flash gives slightly better quality at
          # ~$3/mo. gemini-2.0-flash is being phased out — newer billing-
          # enabled projects return HTTP 404 for it.
          USE_LLM:              'false'      # Gemini analysis disabled for now
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:         'gemini-2.5-flash-lite'

          # ─── SCANNER CONFIG ───────────────────────────────────────────
          TIMEFRAMES:           '1d,1wk,125m'
          ALERT_ENTRY_PCT:      '1.0'
          ALERT_MIN_SCORE:      '7.0'
          STRICT_FILTER:        'true'
          TF_125M_CLOSENESS_PCT: '0.30'
          POLL_SECONDS:         '30'
          CACHE_REFRESH_MINS:   '60'
          PYTHONUNBUFFERED:     '1'
        run: python -u loop_scan.py

      - name: Commit updated state
        if: always()                # commit state even if scanner exited via SIGTERM
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --cached --quiet || git commit -m "loop scan: update state [skip ci]"
          git push || echo "nothing to push"

      - name: Notify on workflow failure
        # Triggers on any failed step (scanner crash, OOM, runner errors).
        # Python-level errors surface via alert_once() inside the scanner —
        # this is the OUTER safety net for failures that prevent the loop
        # from running at all.
        # Dispatches via Python so the same ALERT_CHANNEL routing applies.
        if: failure()
        env:
          ALERT_CHANNEL:      ${{ env.ALERT_CHANNEL || 'email' }}
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: |
          python -c "
          import os
          from scanner import dispatch_alert
          msg = (
              '🚨 *CRITICAL: Scanner workflow FAILED*\n'
              f'_Run:_ {os.environ[\"GITHUB_SERVER_URL\"]}/'
              f'{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/'
              f'{os.environ[\"GITHUB_RUN_ID\"]}\n'
              f'_Job:_ {os.environ[\"GITHUB_JOB\"]}'
          )
          dispatch_alert(msg)
          " || true
