name: Nifty Zone Scanner (Live)

on:
  # Scheduling is handled by an EXTERNAL service (cron-job.org) that POSTs to
  # the workflow_dispatch endpoint on a real schedule. GitHub Actions' own
  # cron is unreliable on free public repos, so it's removed here.
  workflow_dispatch:

permissions:
  contents: write      # needed to commit updated state.json back to repo

# Cancel an in-progress run if a new one is queued (avoids overlap)
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9   # safety net; should never exceed the 10-min window
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TG_TOKEN:        ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
          TIMEFRAMES:      '1d,1wk'    # both Daily and Weekly zones
          ALERT_ENTRY_PCT: '1.0'        # entry line = proximal +/- 1%
          ALERT_MIN_SCORE: '7.0'
          STRICT_FILTER:   'true'       # demand: trend HTF up + price closer to zone HTF demand
                                        # supply: trend HTF down + price closer to zone HTF supply
        run: python scanner.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_*.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push || echo "nothing to push"
