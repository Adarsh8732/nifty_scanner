name: Refresh Dhan Token

# Triggered by cron-job.org POST once a day before market open (8:55 AM IST).
# GitHub's native cron is unreliable on free public repos, so we rely on
# cron-job.org (same external trigger we use for the main scanner).
# Manual "Run workflow" button also works for one-off testing.

on:
  workflow_dispatch:

permissions:
  contents: read   # minimum: needed for actions/checkout to clone code.
                   # Secrets API calls use GH_REPO_PAT exclusively
                   # (GITHUB_TOKEN cannot write secrets even with full perms).

concurrency:
  group: refresh-dhan
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyotp PyNaCl requests

      - name: Refresh token
        env:
          DHAN_CLIENT_ID:   ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN:         ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          GH_REPO_PAT:      ${{ secrets.GH_REPO_PAT }}
          GH_OWNER:         ${{ github.repository_owner }}
          GH_REPO:          ${{ github.event.repository.name }}
        run: python refresh_dhan_token.py

      - name: Notify Telegram on refresh failure
        # If this step ever runs, the daily token rotation broke. Scanner
        # will read an expired access token tomorrow and lose live LTPs.
        if: failure()
        run: |
          MSG="🚨 *CRITICAL: Dhan token refresh FAILED*"
          MSG="${MSG}%0AScanner will lose live LTPs at next session."
          MSG="${MSG}%0A_Run:_ ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="${MSG}%0A_Time:_ $(date -u +%H:%M)Z"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d text="${MSG}" > /dev/null || true
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
