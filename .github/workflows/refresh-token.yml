name: Refresh Dhan Token

# Triggered by cron-job.org POST once a day before market open (8:55 AM IST).
# GitHub's native cron is unreliable on free public repos, so we rely on
# cron-job.org (same external trigger we use for the main scanner).
# Manual "Run workflow" button also works for one-off testing.

on:
  workflow_dispatch:

permissions:
  contents: read   # minimum: needed for actions/checkout to clone code.
                   # Secrets API calls use GH_REPO_PAT exclusively
                   # (GITHUB_TOKEN cannot write secrets even with full perms).

concurrency:
  group: refresh-dhan
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyotp PyNaCl requests

      - name: Refresh token
        env:
          DHAN_CLIENT_ID:   ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN:         ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          GH_REPO_PAT:      ${{ secrets.GH_REPO_PAT }}
          GH_OWNER:         ${{ github.repository_owner }}
          GH_REPO:          ${{ github.event.repository.name }}
        run: python refresh_dhan_token.py

      - name: Notify on refresh failure
        # If this step ever runs, the daily token rotation broke. Scanner
        # will read an expired access token tomorrow and lose live LTPs.
        # Routes through dispatch_alert so the same ALERT_CHANNEL toggle
        # (Telegram vs email vs both) applies here too.
        if: failure()
        env:
          ALERT_CHANNEL:      'email'         # match scan.yml during ban
          TG_TOKEN:           ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:         ${{ secrets.TG_CHAT_ID }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: |
          pip install -r requirements.txt
          python -c "
          import os
          from scanner import dispatch_alert
          msg = (
              '🚨 *CRITICAL: Dhan token refresh FAILED*\n'
              'Scanner will lose live LTPs at next session.\n'
              f'_Run:_ {os.environ[\"GITHUB_SERVER_URL\"]}/'
              f'{os.environ[\"GITHUB_REPOSITORY\"]}/actions/runs/'
              f'{os.environ[\"GITHUB_RUN_ID\"]}'
          )
          dispatch_alert(msg)
          " || true
